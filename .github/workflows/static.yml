name: Deploy Vite to Pages

on:
  push:
    branches: ["principal", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          if [ -f "package.json" ]; then
            npm install && npm run build
            mkdir -p output && cp -r dist/* output/
          else
            cd gestor-de-taller-6-nov-2026-10-13-59-pm
            npm install && npm run build
            mkdir -p ../output && cp -r dist/* ../output/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
