name: Deploy Vite to Pages

on:
  push:
    branches: ["principal", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: principal
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          PKG_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
          echo "Encontrado en: $PKG_DIR"
          cd "$PKG_DIR"
          npm install
          npx vite build --base=/Gestor-taller/
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp -r dist/* "$GITHUB_WORKSPACE/output/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
